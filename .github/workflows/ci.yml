name: Mirror CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  # ────────────────────────────────────────────────────────
  # JOB 1: FRONTEND QUALITY ASSURANCE (LINT & TEST)
  # ────────────────────────────────────────────────────────
  frontend-qa:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    - name: Run Lint
      working-directory: frontend
      run: npm run lint

    - name: Run Tests
      working-directory: frontend
      env:
        FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
        FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
      run: npm run test -- --watch=false --no-progress --browsers=ChromeHeadlessCI

  # ────────────────────────────────────────────────────────
  # JOB 2: VERCEL PRODUCTION WEB DEPLOYMENT
  # ────────────────────────────────────────────────────────
  deploy-vercel:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: frontend-qa
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    - name: Build Production
      working-directory: frontend
      env:
        API_URL: ${{ secrets.API_URL }}
        FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
        FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
      run: npm run build

    - name: Deploy to Vercel
      env:
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes

  # ────────────────────────────────────────────────────────
  # JOB 3: ANDROID COMPILATION AND APK RELEASE
  # ────────────────────────────────────────────────────────
  build-android:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: frontend-qa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    - name: Build Production
      working-directory: frontend
      env:
        API_URL: ${{ secrets.API_URL }}
        FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
        FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
      run: npm run build

    - name: Setup Java Runtime for Android Build
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build Android APK via Gradle
      working-directory: frontend
      run: |
        npx cap sync android
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Mirror.apk

    - name: Delete old release to force timestamp update
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release delete latest --cleanup-tag -y || true

    - name: Upload Mirror.apk to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: frontend/android/app/build/outputs/apk/debug/Mirror.apk
        tag_name: latest
        name: Mirror Mobile Build
        make_latest: true

  # ────────────────────────────────────────────────────────
  # JOB 4: SPRING BOOT MICROSERVICES TO AZURE APP SERVICE
  # ────────────────────────────────────────────────────────
  deploy-backend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: frontend-qa
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Grant Execute Permission to Maven Wrapper
      run: chmod +x mvnw
      working-directory: backend

    - name: Build with Maven
      run: ./mvnw clean package -DskipTests
      working-directory: backend

    - name: Deploy Auth Service to Azure
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'mirror-auth-service'
        publish-profile: ${{ secrets.AZURE_AUTH_PUBLISH_PROFILE }}
        package: 'backend/auth-service/target/*.jar'

    - name: Deploy API Gateway to Azure
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'mirror-api-gateway'
        publish-profile: ${{ secrets.AZURE_GATEWAY_PUBLISH_PROFILE }}
        package: 'backend/api-gateway/target/*.jar'

    - name: Deploy Memory Service to Azure
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'miror-memory-service'
        publish-profile: ${{ secrets.AZURE_MEMORY_PUBLISH_PROFILE }}
        package: 'backend/memory-service/target/*.jar'