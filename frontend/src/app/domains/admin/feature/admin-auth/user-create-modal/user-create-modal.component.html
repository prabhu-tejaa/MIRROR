<ion-header class="glassy-modal-header">
  <ion-toolbar>
    <ion-title>Create New User</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss(false)">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding glassy-modal-content">
  <div class="modal-form-wrapper">
    <div class="user-overview">
      <div class="modal-avatar create-avatar">
        <ion-icon name="person-add-outline"></ion-icon>
      </div>
      <div class="user-meta">
        <h3>New User Account</h3>
        <p class="user-id-sub">This user will be created as pre-verified (no OTP needed)</p>
      </div>
    </div>

    <form #createUserForm="ngForm" class="modal-form" (ngSubmit)="create()">
      <div class="form-group">
        <label for="create-username" class="field-label">Username</label>
        <div class="input-wrapper">
          <ion-icon name="person-outline" class="input-icon"></ion-icon>
          <input 
            type="text" 
            id="create-username" 
            name="username" 
            required 
            placeholder="Enter username" 
            class="glass-input"
            [(ngModel)]="createForm.username"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="create-email" class="field-label">Email Address</label>
        <div class="input-wrapper">
          <ion-icon name="mail-outline" class="input-icon"></ion-icon>
          <input 
            type="email" 
            id="create-email" 
            name="email" 
            required 
            placeholder="e.g. admin@tech.com" 
            class="glass-input"
            [(ngModel)]="createForm.email"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="create-password" class="field-label">Password</label>
        <div class="input-wrapper">
          <ion-icon name="key-outline" class="input-icon"></ion-icon>
          <input 
            type="password" 
            id="create-password" 
            name="password" 
            required 
            placeholder="Set a password (min 6 chars)" 
            class="glass-input"
            [(ngModel)]="createForm.password"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="create-role" class="field-label">Access Role</label>
        <div class="input-wrapper select-wrapper">
          <ion-icon name="shield-outline" class="input-icon"></ion-icon>
          <select 
            id="create-role" 
            name="role" 
            class="glass-select" 
            [(ngModel)]="createForm.role">
            <option value="ROLE_USER">User (Standard Access)</option>
            <option value="ROLE_ADMIN">Admin (Privileged Access)</option>
          </select>
        </div>
      </div>

      <div class="create-info-note">
        <ion-icon name="shield-outline" class="note-icon"></ion-icon>
        <p>This user will be created with <strong>verified status</strong> — they can login immediately without email OTP verification.</p>
      </div>

      <div class="modal-actions">
        <ion-button 
          type="button" 
          fill="clear" 
          class="cancel-btn" 
          [disabled]="isSubmitting"
          (click)="dismiss(false)">
          Cancel
        </ion-button>
        
        <ion-button 
          type="submit" 
          class="save-btn create-btn" 
          [disabled]="isSubmitting || !createUserForm.valid">
          @if (!isSubmitting) {
            <span>Create User</span>
          } @else {
            <div class="loading-dots">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          }
        </ion-button>
      </div>
    </form>
  </div>
</ion-content>
