<ion-app>
  <app-starfield [nebulaGlow]="false"></app-starfield>
  
  <ion-content [fullscreen]="true" [scrollY]="true" force-overscroll="true" style="--background: transparent; height: 100%;">

    <ion-router-outlet [animated]="false"></ion-router-outlet>
  </ion-content>

  <app-no-internet [isVisible]="(isOffline$ | async) || false"></app-no-internet>
  <app-scroll-assistant></app-scroll-assistant>
</ion-app>
