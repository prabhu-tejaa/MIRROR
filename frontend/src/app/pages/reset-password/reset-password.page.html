<ion-content [fullscreen]="true" class="transparent-bg">
  <div class="login-wrapper">
    
    <div class="branding-header">
      <div class="title-glow">
        <h1 class="splash-title">R E S E T</h1>
      </div>
      <p class="splash-tagline">Secure your access.</p>
    </div>

    <div class="glassy-card">
      <h2 class="form-title">Enter New Password</h2>
      
      <form [formGroup]="resetForm" (ngSubmit)="onReset()">
        
        <div class="input-group">
          <ion-input
            formControlName="password"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="New Password"
            class="glassy-input"
          >
            <ion-icon slot="end" [name]="showPassword ? 'eye' : 'eye-off'" (click)="showPassword = !showPassword" style="font-size: 1.4rem; margin-right: 0.5rem; cursor: pointer; color: #888888;"></ion-icon>
          </ion-input>
          @if (isSubmitted && f['password'].errors) {
            <div class="error-msg">
              @if (f['password'].errors['required']) { <span>Password required</span> }
              @if (f['password'].errors['minlength']) { <span>Minimum 6 characters</span> }
            </div>
          }
        </div>


        <ion-button type="submit" expand="block" class="premium-btn" [disabled]="isLoading">
          @if (!isLoading) {
            <span>Save & Login</span>
          } @else {
            <ion-spinner name="crescent" color="dark"></ion-spinner>
          }
        </ion-button>
        
        <div class="signup-wrapper">
          <span class="signup-text"><a (click)="goToLogin()" class="signup-link">Back to Login</a></span>
        </div>
      </form>
    </div>

  </div>
</ion-content>
