<ion-content [fullscreen]="true" [scrollY]="false"
  [class]="'chat-content-container ' + activeStyle() + ' emotion-' + currentEmotion().toLowerCase()"
  [style.--emotion-color-primary]="currentPrimaryColor()"
  [style.--emotion-color-secondary]="currentSecondaryColor()">

  <!-- Ambient Glow Backdrop Orbs (Removed per user preference; only bottom input glow retained) -->
  <!--
  <div class="ambient-glows">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>
  -->

  <div class="chat-wrapper">
 
    <!-- Message Stream -->
    <div class="message-stream" #streamScroll>

      <!-- Load More Indicator (top of chat) -->
      <div class="load-more-indicator" *ngIf="isLoadingMore()">
        <div class="load-more-dots">
          <span></span><span></span><span></span>
        </div>
        <span class="load-more-text">Loading older messages...</span>
      </div>

      <!-- Initial History Loading Skeleton -->
      <div class="history-loading-skeleton" *ngIf="isLoadingHistory()">
        <div class="skeleton-dot-wave">
          <span></span><span></span><span></span>
        </div>
        <p class="skeleton-text">Connecting...</p>
      </div>

      <!-- Premium Dynamic Welcome Banner (shown only when chat is completely empty) -->
      <div class="welcome-banner" *ngIf="todayMessages().length === 0 && !isLoadingHistory()">
        <h1 class="greeting-title">
          <span class="greeting-time-text">{{ getGreeting() }},</span>
          <span class="username-highlight">
            {{ getUsername() }}
          </span>
        </h1>
        <p class="greeting-subtitle">
          <span class="quote-text">“{{ activeQuote().text }}”</span>
          <span class="quote-author">{{ activeQuote().author }}</span>
        </p>
      </div>
 
      <div *ngFor="let msg of todayMessages(); trackBy: trackByMessageId" [@messageAnimation] class="message-wrapper" [class.user-message]="msg.sender === 'user'"
        [class.mirror-message]="msg.sender === 'mirror'">
 
        <div class="avatar" *ngIf="msg.sender === 'mirror'">
          <ion-icon name="finger-print" [class.loading-fingerprint]="msg.isTyping"></ion-icon>
        </div>
 
        <div [class]="'message-bubble ' + (msg.isTyping ? 'typing-bubble ' : '') + (msg.emotion ? 'emotion-' + msg.emotion.toLowerCase() : '')"
          [style.--bubble-color-primary]="msg.primaryColor"
          [style.--bubble-color-secondary]="msg.secondaryColor">
          <ng-container *ngIf="!msg.isTyping; else typingIndicator">
            <p class="msg-text">{{ msg.text }}</p>
            <div class="bubble-meta">
              <button class="tts-button" *ngIf="msg.sender === 'mirror'" (click)="speakText(msg.id, msg.text, $event)" [class.speaking]="currentlySpeakingId() === msg.id" aria-label="Listen to reflection">
                <ion-icon [name]="currentlySpeakingId() === msg.id ? 'volume-high-outline' : 'volume-mute-outline'"></ion-icon>
              </button>
              <span class="vibe-badge" *ngIf="msg.sender === 'mirror' && msg.emotion && msg.emotion !== 'NEUTRAL' && isAdmin()">
                {{ msg.emotion }}
              </span>
              <span class="msg-time">{{ msg.timestamp | date:'shortTime' }}</span>
            </div>
          </ng-container>

          <ng-template #typingIndicator>
            <div class="typing-dots">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </ng-template>
        </div>
      </div>
    </div>

    <!-- Suggestions panel removed per user preference -->

    <!-- Active Recording Overlay Simulator (within layout) -->
    <div class="voice-active-overlay" *ngIf="isRecording()">
      <div class="waveform">
        <div class="bar bar-1"></div>
        <div class="bar bar-2"></div>
        <div class="bar bar-3"></div>
        <div class="bar bar-4"></div>
        <div class="bar bar-5"></div>
        <div class="bar bar-6"></div>
        <div class="bar bar-7"></div>
        <div class="bar bar-8"></div>
      </div>
      <div class="voice-status-container">
        <p class="voice-transcription-status">LISTENING & TRANSCRIBING...</p>
        <p class="voice-transcription-substatus">Tap the red stop button or speak to automatically finish.</p>
      </div>
    </div>

    <!-- Entry Control Capsule -->
    <div class="entry-capsule-container">
      <div class="bottom-ambient-glow"></div>
      <div class="bottom-ambient-glow-secondary"></div>
      <div class="entry-capsule">
        <button class="voice-btn" [class.recording]="isRecording()" [class.disabled]="isWaitingForResponse() || isResting()" [disabled]="isWaitingForResponse() || isResting()" (click)="toggleRecording()"
          [aria-label]="isRecording() ? 'Stop voice input' : 'Start voice input'">
          <ion-icon [name]="isRecording() ? 'stop-circle-outline' : 'mic-outline'" class="mic-icon"></ion-icon>
          <span class="record-ring" *ngIf="isRecording()"></span>
        </button>

        <input type="text" [placeholder]="isResting() ? 'Aura is resting...' : 'Speak or type...'" [ngModel]="chatInput()"
          (ngModelChange)="chatInput.set($event)" (keypress)="handleKeyPress($event)"
          (focus)="moveCursorToEnd($event)" (click)="moveCursorToEnd($event)" #textInput
          aria-label="Chat input message" [disabled]="isResting()" />

        <button class="send-btn" [class.disabled]="!chatInput().trim() || isWaitingForResponse() || isResting()" [disabled]="!chatInput().trim() || isWaitingForResponse() || isResting()"
          (click)="triggerSend()" aria-label="Send message">
          <ion-icon name="send-outline"></ion-icon>
        </button>
      </div>
    </div>

  </div>

</ion-content>
