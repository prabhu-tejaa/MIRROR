<ion-content [fullscreen]="true" class="ion-padding">
  <!-- Custom Space-themed Header -->
  <div class="dashboard-nav">
    <button class="back-circle-btn" (click)="goBack()" title="Back to Profile">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>

    <!-- Right side: Live Presence pill inline (no PREVIEW badge) -->
    <div class="nav-right-group" *ngIf="{ count: (onlineUsersCount$ | async) ?? 0 } as state">
      <div class="live-presence-pill" [class.offline]="state.count === 0">
        <span class="presence-dot"></span>
        <span class="presence-label">{{ state.count }} Online</span>
      </div>
    </div>

  </div>

  <div class="dashboard-layout-container">
    <!-- Service Flows Grid -->
    <div class="services-grid">

      <!-- API Gateway Card
      <div class="service-card active" routerLink="/admin/api-gateway">
        <div class="card-top">
          <div class="icon-box gateway-icon">
            <ion-icon name="pulse-outline"></ion-icon>
          </div>
        </div>
        
        <div class="card-body">
          <h3>API Gateway</h3>
          <p>Orchestrate active routing maps, monitor latency telemetry, check registry status, and view live traffic logs.</p>
        </div>
        
        <div class="card-footer">
          <span class="action-text">Stream Logs & Telemetry</span>
          <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
        </div>
      </div> -->

      <!-- Auth Service Card -->
      <div class="service-card active" (click)="navigateTo('/admin/auth-service')">
        <div class="card-header-row">
          <div class="card-title-group">

            <h3>Auth Service</h3>
          </div>
        </div>

      </div>

      <!-- Memory Service Card -->
      <div class="service-card active" (click)="navigateTo('/admin/memory-service')">
        <div class="card-header-row">
          <div class="card-title-group">
            <h3>Memory Service</h3>
          </div>
        </div>
      </div>

    </div>
  </div>
</ion-content>
